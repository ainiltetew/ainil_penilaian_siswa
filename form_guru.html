<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Guru</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="css/style.css" />
    <script src="js/include.js" defer></script>
    <script type="text/javascript" src="js/sidebar.js" defer></script>
  </head>
  <body>
    <my-header></my-header>
    <main>
      <div class="content-container">
        <h2>Form Guru</h2>
        <form>
          <div class="mb-3">
            <label for="exampleInputEmail1" class="form-label">NUPTK</label>
            <input
              type="number"
              class="form-control"
              id="exampleInputEmail1"
              aria-describedby="emailHelp"
            />
          </div>
          <div class="mb-3">
            <label for="exampleInputPassword1" class="form-label">Nama</label>
            <input
              type="text"
              class="form-control"
              id="exampleInputPassword1"
            />
          </div>
          <div class="form-check">
            <input
              class="form-check-input"
              type="radio"
              name="radioDefault"
              id="radioDefault1"
            />
            <label class="form-check-label" for="radioDefault1">
              Laki-laki
            </label>
          </div>
          <div class="form-check">
            <input
              class="form-check-input"
              type="radio"
              name="radioDefault"
              id="radioDefault2"
              checked
            />
            <label class="form-check-label" for="radioDefault2">
              Perempuan
            </label>
          </div>
          <div class="mb-3">
            <select class="form-select" aria-label="Default select example">
              <option selected>Agama</option>
              <option value="1">Islam</option>
              <option value="2">Kristen</option>
              <option value="3">Budha</option>
            </select>
          </div>
          <div class="mb-3">
            <label for="exampleInputPassword1" class="form-label">Asal</label>
            <input
              type="text"
              class="form-control"
              id="exampleInputPassword1"
            />
          </div>
        </form>
        <button
          class="btn btn-secondary"
          onclick="window.location.href = 'data_guru.html'"
        >
          Kembali
        </button>
        <button type="submit" class="btn btn-primary">Submit</button>
      </div>
    </main>
    <my-footer> </my-footer>
  </body>
</html>
