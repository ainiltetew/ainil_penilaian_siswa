<!doctype html>

  <head>
    <meta charset="UTF-8" />

    <title>Penilaian</title>
    <link

  <body>
    <my-header></my-header>
    <main>
      <div class="content-container">
        <h2>Penilaian</h2>
        <select
          class="form-select form-select-lg mb-3"
          aria-label=".form-select-lg example"
        >
          <option selected>Periode</option>
          <option value="1">2025 Semester 1</option>
          <option value="2">2025 Semester 2</option>
          <option value="3">2026 Semester 1</option>
          <option value="3">2026 Semester 2</option>
        </select>

        <select
          class="form-select form-select-sm mb-2"
          aria-label=".form-select-sm example"
        >
          <option selected>Kelas</option>
          <option value="1">1A</option>
          <option value="2">1B</option>
          <option value="3">1C</option>
          <option value="1">2A</option>
          <option value="2">2B</option>
          <option value="3">2C</option>
        </select>
        <select
          class="form-select form-select-sm"
          aria-label=".form-select-sm example"
        >
          <option selected>Mata Kuliah</option>
          <option value="1">Matematika</option>
          <option value="2">Pendidikan Kewarganegaraan</option>
          <option value="3">IPA</option>
          <option value="1">IPS</option>
          <option value="2">PJOK</option>
          <option value="3">SBK</option>
        </select>
        <br />
        <table class="table table-striped">
          <thead>
            <tr>
              <th scope="col">#</th>
              <th scope="col">NIS</th>
              <th scope="col">Nama</th>
              <th scope="col">Tugas</th>
              <th scope="col">UTS</th>
              <th scope="col">UAS</th>
              <th scope="col">Act</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <th scope="row">1</th>
              <td>001</td>
              <td>Otto</td>
              <td>80</td>
              <td>90</td>
              <td>100</td>
              <td>
                <a href="form_nilai.html" class="btn btn-warning btn-sm">Edit</a
                ><a href="form_nilai.html" class="btn btn-danger btn-sm"
                  >Hapus</a
                >
              </td>
            </tr>
            <tr>
              <th scope="row">2</th>
              <td>002</td>

              <td>80</td>

              <td>

                  >Hapus</a

              </td>
            </tr>
            <tr>

              <td>003</td>
              <td>Otto</td>
              <td>80</td>
              <td>90</td>
              <td>100</td>
              <td>
                <a href="form_nilai.html" class="btn btn-warning btn-sm">Edit</a
                ><a href="form_nilai.html" class="btn btn-danger btn-sm"
                  >Hapus</a
                >
              </td>
            </tr>
