<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pelanggaran</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="css/style.css" />
    <script src="js/include.js" defer></script>
    <script type="text/javascript" src="js/sidebar.js" defer></script>
  </head>
  <body>
    <my-header></my-header>
    <main>
      <div class="content-container">
        <h2>Pelanggaran</h2>
        <table class="table table-striped">
          <thead>
            <tr>
              <th scope="col">#</th>
              <th scope="col">NIS</th>
              <th scope="col">Nama</th>
              <th scope="col">Pelanggaran</th>
              <th scope="col">Poin</th>
              <th scope="col">Tanggal</th>
              <th scope="col">Act</th>
            </tr>
          </thead>
          <tbody id="tbody-pelanggaran"></tbody>
        </table>
        <button
          class="btn btn-primary"
          onclick="window.location.href = 'form_pelanggaran.html'"
        >
          Tambah Pelanggaran
        </button>
      </div>
    </main>
    <my-footer> </my-footer>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/jquery-validation@1.19.5/dist/jquery.validate.min.js"></script>
    <script src="js/table_pelanggaran.js"></script>
  </body>
</html>
