<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/login.css" />

    <script src="https://code.jquery.com/jquery-3.7.1.js"></script>
  </head>

  <body>
    <div class="login-card">
      <h1>Login</h1>
      <p>Silakan masuk untuk melanjutkan</p>

      <div class="input-group">
        <label>Username</label>
        <input type="text" id="user" placeholder="Masukkan username" value="admin"/>
      </div>

      <div class="input-group">
        <label>Password</label>
        <input type="password" id="pass" placeholder="Masukkan password" value="1234"/>
      </div>

      <button id="submit" class="btn btn-primary">Login</button>

      <div class="login-footer">Web Penilaian Siswa</div>
      <br />
      <p>
        catatan: user: admin pass: 1234 <br />Lalu untuk menggunakan
        halaman login, harus menggunakan live server agar fetch JSON dapat
        digunakan
      </p>
    </div>

    <script>
      $("#submit").click(async function () {
        const email = $("#user").val();
        const password = $("#pass").val();

        const response = await fetch("database/akun.json");

        const akun = await response.json();

        const dataAkun = akun.find(
          (item) => item.email === email && item.password === password,
        );

        if (dataAkun) {
          localStorage.setItem("login", JSON.stringify(dataAkun));

          window.location.href = "index.html";
        } else {
          alert("Email atau password salah");
        }
      });
    </script>
  </body>
</html>
