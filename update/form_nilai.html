<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nilai</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <link rel="stylesheet" href="css/style.css" />
    <script src="js/include.js" defer></script>
    <script type="text/javascript" src="js/sidebar.js" defer></script>
  </head>
  <body>
    <my-header></my-header>
    <main>
      <div class="content-container">
        <h2>Form Penilaian Siswa</h2>
        <form id="form-nilai">
          <div class="mb-3">
            <label class="form-label"> Tugas </label>

            <input type="number" class="form-control" id="tugas" name="tugas" />
          </div>

          <div class="mb-3">
            <label class="form-label"> UTS </label>

            <input type="number" class="form-control" id="uts" name="uts" />
          </div>

          <div class="mb-3">
            <label class="form-label"> UAS </label>

            <input type="number" class="form-control" id="uas" name="uas" />
          </div>

          <button
            type="button"
            class="btn btn-secondary"
            onclick="window.location.href = 'penilaian.html'"
          >
            Kembali
          </button>

          <button type="submit" class="btn btn-primary">Submit</button>
        </form>
      </div>
    </main>
    <my-footer> </my-footer>
    <script src="js/form_nilai.js"></script>
  </body>
</html>
