<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nilai</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="css/style.css" />
    <script src="js/include.js" defer></script>
    <script type="text/javascript" src="js/sidebar.js" defer></script>
  </head>
  <body>
    <my-header></my-header>
    <main>
      <div class="content-container">
        <h2>Form Penilaian Siswa</h2>
        <form>
          <div class="mb-3">
            <label for="exampleInputEmail1" class="form-label">Tugas</label>
            <input
              type="number"
              class="form-control"
              id="exampleInputEmail1"
              aria-describedby="emailHelp"
            />
          </div>
          <div class="mb-3">
            <label for="exampleInputPassword1" class="form-label">UTS</label>
            <input
              type="text"
              class="form-control"
              id="exampleInputPassword1"
            />
          </div>

          <div class="mb-3">
            <label for="exampleInputPassword1" class="form-label">UAS</label>
            <input
              type="text"
              class="form-control"
              id="exampleInputPassword1"
            />
          </div>
        </form>
        <button
          class="btn btn-secondary"
          onclick="window.location.href = 'penilaian.html'"
        >
          Kembali
        </button>
        <button type="submit" class="btn btn-primary">Submit</button>
      </div>
    </main>
    <my-footer> </my-footer>
  </body>
</html>
