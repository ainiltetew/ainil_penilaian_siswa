<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>25-010_M. Ainil Habib Wahyudin_TP8</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/login.css" />

    <script src="https://code.jquery.com/jquery-3.7.1.js"></script>
  </head>

  <body>
    <div class="login-card">
      <h1>Login</h1>
      <p>Silakan masuk untuk melanjutkan</p>

      <div class="input-group">
        <label>Username</label>
        <input type="text" id="user" placeholder="Masukkan username" value="admin"/>
      </div>

      <div class="input-group">
        <label>Password</label>
        <input type="password" id="pass" placeholder="Masukkan password" value="1234"/>
      </div>

      <button id="submit" class="btn btn-primary">Login</button>

      <div class="login-footer">Web Penilaian Siswa</div>
      <br />
      <p>
        catatan: user: bisa diisi admin/guru/murid untuk pass nya semua: 1234 <br />
      </p>
    </div>

    <script>
      $("#submit").click(async function () {
        const user = $("#user").val();
        const pass = $("#pass").val();

        const response = await fetch("database/database.json");
        const data = await response.json();

        const akun = data.akun.find((a) => a.user === user && a.pass === pass);

        if (akun) {
          localStorage.setItem(
            "login",
            JSON.stringify({
              user: akun.user,
              role: akun.role,
            }),
          );

          window.location.href = "index.html";
        } else {
          alert("User atau password salah");
        }
      });
    </script>
  </body>
</html>
